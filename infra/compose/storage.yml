# Blog Storage Services
# rustfs

services:
  ###########################################################################
  # rustfs
  # docker compose exec -it storage sh
  #
  # CREDENTIALS:      rustfsadmin/rustfsadmin
  # SERVICE URLS:
  # Storage API:      http://localhost:9000/
  # Storage Console:  http://localhost:9001/
  ###########################################################################
  storage:
    image: rustfs/rustfs:latest
    container_name: storage
    hostname: storage
    restart: always
    # profiles: [optional]
    command: server /data --console-address ":9001"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS="*"
      - RUSTFS_CORS_ALLOWED_ORIGINS="*"
      - RUSTFS_API_CORS_ALLOW_ORIGINS="*"
      - RUSTFS_ACCESS_KEY=${RUSTFS_ROOT_USER:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
    ports:
      - "9000:9000" # API endpoint
      - "9001:9001" # Console
    volumes:
      - storage_data:/data
      - ../rustfs/cors.json:/cors.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      start_period: 30s
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  storage-init:
    image: rustfs/rc:latest
    container_name: storage-init
    # profiles: [optional]
    depends_on:
      storage:
        condition: service_healthy
    volumes:
      # Browsers upload through presigned URLs on the RustFS origin, so the bucket also needs a CORS rule
      - ../rustfs/cors.json:/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      rc alias set local http://storage:9000 $${RUSTFS_ROOT_USER} $${RUSTFS_ROOT_PASSWORD};
      until rc ready local; do echo 'waiting for rustfs...'; sleep 2; done;
      rc admin user add local $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY};
      rc admin policy attach local readwrite --user=$${S3_ACCESS_KEY_ID};
      rc mb local/$${S3_IMAGES_BUCKET} --ignore-existing;
      rc bucket cors set local/$${S3_IMAGES_BUCKET} --file /cors.json;
      rc mb local/$${S3_FILES_BUCKET} --ignore-existing;
      rc bucket cors set local/$${S3_FILES_BUCKET} --file /cors.json;
      rc mb local/$${S3_AGENTS_BUCKET} --ignore-existing;
      rc bucket cors set local/$${S3_AGENTS_BUCKET} --file /cors.json;
      rc anonymous set download local/$${S3_IMAGES_BUCKET};
      echo 'Storage app user and buckets created and configured';
      exit 0;
      "
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-appuser}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-apppassword}
      S3_IMAGES_BUCKET: ${S3_IMAGES_BUCKET:-images}
      S3_FILES_BUCKET: ${S3_FILES_BUCKET:-files}
      S3_AGENTS_BUCKET: ${S3_AGENTS_BUCKET:-agents}

volumes:
  storage_data:
