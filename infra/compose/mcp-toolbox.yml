# MCP Toolbox Services
# Google MCP Toolbox for Databases

services:
  ###########################################################################
  # mcp-toolbox
  # Serves webapp's Postgres tools over MCP for coding agents.
  # See content/docs/developer/development/mcp.mdx for config and security notes.
  # SERVICE URL: http://localhost:5010/mcp
  # HEALTHCHECK URL: http://localhost:5010/healthz
  # WELL-KNOWN URL: http://localhost:5010/.well-known/oauth-protected-resource
  # TODO: Disabled healthcheck for docker-compose because it's distroless, but enable for k8s deployment
  # TODO: Remove the `--prebuilt postgres` flag for production deployment and use a custom tools.yaml instead.
  # TODO: Add --allowed-origins  ,  --allowed-hosts  flags for production deployment to restrict access to the MCP Toolbox.
  # IMPORTANT: MacOS uses port 5000 by default for the built-in AirPlay Receiver service. use 5010 instead to avoid conflicts.
  ###########################################################################
  mcp-toolbox:
    # TODO: It is recommended to pin to a specific image version instead of latest (e.g. 1.9.0).
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.9.0
    hostname: mcp-toolbox
    container_name: mcp-toolbox
    restart: unless-stopped
    platform: linux/amd64
    command:
      [
        "--config",
        "/app/tools.yaml",
        "--prebuilt",
        "postgres",
        "--address",
        "0.0.0.0",
        "--port",
        "5010",
        "--log-level",
        "warn",
        "--ui",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${TOOLBOX_DB_USER:-toolbox}
      POSTGRES_PASSWORD: ${TOOLBOX_DB_PASSWORD:-toolbox}
      TOOLBOX_URL: ${TOOLBOX_URL:-http://localhost:5010}
    ports:
      - "5010:5010"
    healthcheck:
      disable: true
    volumes:
      - ../mcp-toolbox/tools.yaml:/app/tools.yaml:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
