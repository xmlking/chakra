# See content/docs/developer/development/mcp.mdx for setup and security notes.
# Documentation: https://mcp-toolbox.dev/documentation/configuration/
# Override TOOLBOX_DB_USER/TOOLBOX_DB_PASSWORD with a read-only role rather than
# relying on the postgres superuser defaults below.
# `Prompts` define templates for interacting with language models
sources:
  webapp-db:
    kind: postgres
    host: postgres
    port: "5432"
    database: ${POSTGRES_DATABASE}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    sqlCommenter: true

# authServices:
#   my-mcp-auth:
#     kind: generic
#     mcpEnabled: true
#     authorizationServer: "https://accounts.google.com" # Your authorization server URL
#     audience: "your-mcp-audience" # Matches the `aud` claim in the JWT
#     scopesRequired:
#       - "mcp:tools"

tools:
  list_organizations:
    kind: postgres-sql
    source: webapp-db
    description: >
      List all organizations, with the organization's name.
    parameters: []
    statement: >
      SELECT o.id,
             o.name,
             o.created_at
      FROM organization o
      ORDER BY o.created_at DESC
      LIMIT 10;

toolsets:
  webapp-readonly:
    - list_organizations
  # Business Intelligence
